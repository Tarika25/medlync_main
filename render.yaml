services:
  # ── Backend (Express + PostgreSQL) ──────────────────────────
  - type: web
    name: medlync-server
    runtime: node
    rootDir: rx-guardian-main/server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medlync-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  # ── Frontend (React/Vite) ────────────────────────────────────
  - type: web
    name: medlync-frontend
    runtime: static
    rootDir: rx-guardian-main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: medlync-server
          type: web
          property: host
          format: https://{host}/api

# ── PostgreSQL Database ──────────────────────────────────────
databases:
  - name: medlync-db
    databaseName: medlync
    user: medlync_user
